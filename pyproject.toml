[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
untyped_calls_exclude = ["nbformat", "nbconvert", "IPython"]
files = ["lab_utils.py", "run_notebook.py", "test_lab.py", "run_tabfm.py"]
